name: Nixpkgs canary

# Early warning for Nixpkgs changes that would break machines' next update:
# evaluates main and the newest beta and stable releases against the
# nixos-unstable channel head, Nixpkgs master (days ahead of the channel) and
# the next stable branch once it exists, and builds each one's expected local
# builds (Cybex OS's own packages, unfree vendor downloads) against the
# channel head (scripts/nixpkgs-canary --build). A failure that machines would
# hit, or a new evaluation warning, keeps a "nixpkgs-canary" issue open.
# Nothing is released or changed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  # actions: the vendor-downloads cache drops the entries it replaces.
  actions: write
  contents: read
  issues: write

concurrency:
  group: nixpkgs-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v4.4.0, as in the repository's other workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      # The builds download their toolchains and vendor packages.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # cachix/install-nix-action, as in the repository's other workflows.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b

      # The vendor-updates workflow's downloads for the current pins (its
      # checks, scripts/vendor-pins), fetched here too: a vendor host GitHub's
      # runners cannot always reach (api.snapcraft.io for the Spotify snap)
      # is reached by whichever run gets through first, and the cache serves
      # both. A failure here only leaves the cache as it was.
      - name: Plan the vendor downloads
        id: downloads
        continue-on-error: true
        run: |
          python3 -I -B scripts/vendor-downloads plan --out "$RUNNER_TEMP/downloads.json" \
            .#packages.x86_64-linux.brave-origin .#checks.x86_64-linux.browser-1password \
            .#packages.x86_64-linux.codex .#packages.x86_64-linux.claude-code .#checks.x86_64-linux.agent-clis \
            >> "$GITHUB_OUTPUT"

      # actions/cache/restore v5.1.0, as in the vendor-updates workflow.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: downloads-cache
        if: steps.downloads.outcome == 'success'
        with:
          path: ${{ runner.temp }}/vendor-downloads
          key: ${{ steps.downloads.outputs.key }}
          restore-keys: vendor-downloads-

      - name: Fetch the vendor downloads
        id: fetch
        if: steps.downloads.outcome == 'success' && steps.downloads-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 -I -B scripts/vendor-downloads fetch --plan "$RUNNER_TEMP/downloads.json" --cache "$RUNNER_TEMP/vendor-downloads"

      # actions/cache/save v5.1.0.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.fetch.outcome == 'success'
        with:
          path: ${{ runner.temp }}/vendor-downloads
          key: ${{ steps.downloads.outputs.key }}

      - name: Drop superseded vendor-download caches
        if: steps.fetch.outcome == 'success'
        run: python3 -I -B scripts/vendor-downloads prune --keep "${{ steps.downloads.outputs.key }}"

      - name: Evaluate and build against upcoming Nixpkgs
        id: canary
        run: |
          set +e
          python3 -I -B scripts/nixpkgs-canary --build --report "$RUNNER_TEMP/canary"
          status=$?
          cat "$RUNNER_TEMP/canary/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo "result=$(cat "$RUNNER_TEMP/canary/status" 2>/dev/null || echo failed)" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Report the result
        if: always()
        run: |
          result="${{ steps.canary.outputs.result }}"
          if [ "$result" = ok ]; then
            python3 -I -B scripts/github-issue close --label nixpkgs-canary \
              --comment "Every source evaluates and builds against the upcoming Nixpkgs again."
            exit 0
          fi
          {
            if [ "$result" = warnings ]; then
              echo "Cybex OS still evaluates against the upcoming Nixpkgs, with new evaluation warnings. They usually announce a removal or rename; fix it before it becomes an error."
            else
              echo "Cybex OS no longer evaluates or builds against an upcoming Nixpkgs revision. Machines that take that revision would fail to prepare or install updates until a Cybex OS release fixes it."
            fi
            echo
            cat "$RUNNER_TEMP/canary/report.md" 2>/dev/null || echo "The canary did not finish."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          title="Nixpkgs canary: Cybex OS fails with upcoming Nixpkgs"
          [ "$result" = warnings ] && title="Nixpkgs canary: new evaluation warnings"
          python3 -I -B scripts/github-issue open --label nixpkgs-canary --title "$title" --body-file "$RUNNER_TEMP/issue.md"
