state_file = "auto"

# Settings → Bar & Control Center → Indicators → Dictation owns whisper.model,
# whisper.language, whisper.streaming, whisper.on_demand_loading,
# whisper.initial_prompt and streaming.revision_mode, and keeps them in line
# with what it shows (docs/dictation.md). Everything else here is yours.

[hotkey]
enabled = false

# Quickshell already exposes recording/transcription state in the managed
# menubar and draws the live words itself; do not probe for Voxtype's
# separate optional OSD frontend.
[osd]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "base"
language = "en"
translate = false
# Live text: the shell's recordings stream, re-reading the words as you speak.
# Voxtype streams only with the model loaded, so it stays resident.
streaming = true
on_demand_loading = false

[streaming]
# The shell's recordings go to a file, so a revised guess only edits text in
# memory; nothing is typed until the dictation ends.
revision_mode = true

# Silence (or a recording with no speech) produces nothing instead of
# Whisper's invented "Thank you." The energy detector needs no model.
[vad]
enabled = true
backend = "energy"

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
driver_order = ["wtype", "clipboard"]

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
