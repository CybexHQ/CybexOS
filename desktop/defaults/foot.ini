# Cybex OS's foot defaults, included from ~/.config/foot/foot.ini. Your own
# settings after that include win.
[main]
font=JetBrainsMono Nerd Font:size=12.0
pad=14x14

[cursor]
style=underline
blink=no

[mouse]
hide-when-typing=yes

# The shell's default dark theme, as desktop/quickshell/scripts/theme_foot.py
# renders it (a test keeps the two equal); it only shows until the shell first
# exports its appearance.
[colors-dark]
alpha=0.95
foreground=f2f0ea
background=1a1917
selection-foreground=ffffff
selection-background=3d5c82
cursor=1a1917 60a5fa
urls=60a5fa
regular0=302f2c
regular1=e8837a
regular2=a3c98f
regular3=d3b47e
regular4=9ecbeb
regular5=c0a8dc
regular6=6ec2b2
regular7=b3afa4
bright0=706f6b
bright1=ffb3ab
bright2=b8dba5
bright3=e5cb98
bright4=b6dcf6
bright5=d4c0ec
bright6=8fd8ca
bright7=f2f0ea

[colors-light]
alpha=0.95
foreground=f2f0ea
background=1a1917
selection-foreground=ffffff
selection-background=3d5c82
cursor=1a1917 60a5fa
urls=60a5fa
regular0=302f2c
regular1=e8837a
regular2=a3c98f
regular3=d3b47e
regular4=9ecbeb
regular5=c0a8dc
regular6=6ec2b2
regular7=b3afa4
bright0=706f6b
bright1=ffb3ab
bright2=b8dba5
bright3=e5cb98
bright4=b6dcf6
bright5=d4c0ec
bright6=8fd8ca
bright7=f2f0ea

# The shell's current appearance, rewritten by theme-apply.py; foot reads it
# as each window starts. Included last so its values win. foot refuses a
# missing include, so personal-init writes an empty one until the shell does.
[main]
include=~/.local/state/cybexos/theme/foot.ini
