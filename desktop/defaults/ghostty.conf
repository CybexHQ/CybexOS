# Cybex OS's Ghostty defaults. ~/.config/ghostty/config loads this file, then
# the shell's current appearance, then your own ~/.config/ghostty/personal.conf
# (Ghostty reads them in that order, after the file that names them).
font-family = JetBrainsMono Nerd Font
window-padding-x = 14
window-padding-y = 14
window-decoration = none
background-opacity = 0.95
cursor-style = underline
cursor-style-blink = false
shell-integration-features = no-cursor
mouse-hide-while-typing = true
confirm-close-surface = false
# The shell's default dark theme and size, as
# desktop/quickshell/scripts/theme_ghostty.py renders it (a test keeps the two
# equal); they only show until the shell first exports its appearance.
font-size = 12.0
foreground = #f2f0ea
background = #1a1917
selection-foreground = #ffffff
selection-background = #3d5c82
cursor-color = #60a5fa
cursor-text = #1a1917
palette = 0=#302f2c
palette = 1=#e8837a
palette = 2=#a3c98f
palette = 3=#d3b47e
palette = 4=#9ecbeb
palette = 5=#c0a8dc
palette = 6=#6ec2b2
palette = 7=#b3afa4
palette = 8=#706f6b
palette = 9=#ffb3ab
palette = 10=#b8dba5
palette = 11=#e5cb98
palette = 12=#b6dcf6
palette = 13=#d4c0ec
palette = 14=#8fd8ca
palette = 15=#f2f0ea
